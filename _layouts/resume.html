<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/_assets/css/site.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/_assets/css/resume.css' | relative_url }}">
    {% if page.stylesheet %}
    <link rel="stylesheet" href="{{ '/_assets/css/' | append: page.stylesheet | append: '.css' | relative_url }}">
    {% endif %}
</head>
<body>
    <div class="resume-wrap">
        {{ content }}
        <a href="{{ '/' | relative_url }}" class="back-link">← Home</a>
    </div>
</body>
</html>
