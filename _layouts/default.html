<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        background: #faf8f3;
        color: #333;
        line-height: 1.6;
      }
      .site-wrapper {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem;
      }
