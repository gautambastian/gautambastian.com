<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <style>
        /* 1. Base Reset & Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #fcfbf7 0%, #f6f5f0 100%);
            font-family: 'Georgia', 'Baskerville', 'Palatino', 'Times New Roman', serif;
            color: #3a5343;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        main {
            text-align: center;
            padding: 2.5rem 1.5rem;
            max-width: 420px;
        }

        /* 2. Portrait Container */
        .profile-container {
            margin-bottom: 1.75rem;
        }

        .profile-photo {
            width: 200px !important;       /* Forces the width constraint */
            height: 200px !important;      /* Forces the height constraint */
            max-width: 100%;               /* Prevents overflowing the parent container */
            border-radius: 50%;
            object-fit: cover;             /* Prevents distortion if your 2000px photo isn't a perfect square */
            filter: grayscale(100%) sepia(20%);
            border: 1px solid rgba(58, 83, 67, 0.15); 
            display: block;
            margin: 0 auto;
        }

        /* 3. Typography Refinements */
        h1 {
            font-size: 2.25rem;
            font-weight: 600; 
            line-height: 1.2;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 1.05rem;
            font-style: italic;
            line-height: 1.5;
            opacity: 0.85;
            letter-spacing: 0.02em; 
            margin-bottom: 1.75rem; 
        }

        /* 4. Icon Links Interactivity */
        .links {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.85rem;
            margin-top: 1rem;
        }

        .icon-links,
        .text-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #3a5343; 
            text-decoration: none;
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            opacity: 0.85;
        }

        .icon-link:hover {
            opacity: 0.65;
            transform: translateY(-2px);
        }
        
        .icon-link:focus-visible {
            outline: 2px dashed rgba(58, 83, 67, 0.5);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .icon-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Elegant, understated styling for the text links */
        .text-link {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 0.95rem;
            color: #3a5343;
            text-decoration: none;
            letter-spacing: 0.05em;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        .text-link:hover {
            opacity: 1;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* 5. Publications Page Styling */
        .pub-list {
            text-align: left; /* Left-align long titles for academic readability */
            margin-top: 2rem;
        }

        .pub-list h3 {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.4rem;
        }

        .pub-list h3 a {
            color: #3a5343;
            text-decoration: none;
            border-bottom: 1px solid rgba(58, 83, 67, 0.2);
            transition: border-color 0.2s ease;
        }

        .pub-list h3 a:hover {
            border-bottom-color: #3a5343;
        }

        .pub-list em {
            font-size: 0.95rem;
            display: block;
            opacity: 0.85;
            margin-bottom: 1.5rem;
        }

        hr {
            border: 0;
            border-top: 1px dashed rgba(58, 83, 67, 0.15);
            margin: 1.5rem 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: #3a5343;
            opacity: 0.7;
            text-decoration: none;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .back-link:hover {
            opacity: 1;
        }

    </style>
</head>
<body>

    <main>
        {{ content }}
    </main>

</body>
</html>
