<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, #fcfbf7 0%, #f6f5f0 100%);
            font-family: 'Georgia', 'Baskerville', 'Palatino', 'Times New Roman', serif;
            color: #3a5343;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            padding: 3rem 1.25rem;
        }

        .resume-wrap {
            max-width: 680px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .resume-header {
            margin-bottom: 2.5rem;
            padding-bottom: 1.75rem;
            border-bottom: 1px solid rgba(58, 83, 67, 0.18);
        }

        .resume-header h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        .resume-header .tagline {
            font-size: 1.05rem;
            font-style: italic;
            opacity: 0.75;
            margin-bottom: 0.85rem;
            letter-spacing: 0.01em;
        }

        .resume-header .contact {
            font-size: 0.9rem;
            opacity: 0.7;
            letter-spacing: 0.03em;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1.1rem;
        }

        .resume-header .contact a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid rgba(58, 83, 67, 0.25);
            transition: border-color 0.2s;
        }

        .resume-header .contact a:hover {
            border-bottom-color: #3a5343;
        }

        /* ── Sections ── */
        .resume-section {
            margin-bottom: 2.25rem;
        }

        .resume-section h2 {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #3a5343;
            opacity: 0.55;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(58, 83, 67, 0.14);
        }

        /* ── Experience / Education entries ── */
        .entry {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0 1.5rem;
            margin-bottom: 1.6rem;
        }

        .entry:last-child {
            margin-bottom: 0;
        }

        .entry-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
            grid-column: 1;
        }

        .entry-org {
            font-size: 0.97rem;
            font-style: italic;
            opacity: 0.8;
            margin-top: 0.15rem;
            grid-column: 1;
        }

        .entry-date {
            font-size: 0.85rem;
            opacity: 0.6;
            white-space: nowrap;
            text-align: right;
            grid-column: 2;
            grid-row: 1;
            padding-top: 0.15rem;
            letter-spacing: 0.02em;
        }

        .entry-bullets {
            grid-column: 1 / -1;
            margin-top: 0.6rem;
            padding-left: 1.1rem;
        }

        .entry-bullets li {
            font-size: 0.97rem;
            line-height: 1.55;
            margin-bottom: 0.4rem;
            opacity: 0.9;
        }

        /* ── Publications ── */
        .pub-entry {
            margin-bottom: 1.4rem;
            padding-left: 1rem;
            border-left: 2px solid rgba(58, 83, 67, 0.18);
        }

        .pub-entry:last-child {
            margin-bottom: 0;
        }

        .pub-title {
            font-size: 1.0rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .pub-title a {
            color: #3a5343;
            text-decoration: none;
            border-bottom: 1px solid rgba(58, 83, 67, 0.25);
            transition: border-color 0.2s;
        }

        .pub-title a:hover {
            border-bottom-color: #3a5343;
        }

        .pub-meta {
            font-size: 0.9rem;
            font-style: italic;
            opacity: 0.72;
            margin-top: 0.25rem;
            line-height: 1.4;
        }

        .pub-coauthors {
            font-size: 0.88rem;
            opacity: 0.65;
            margin-top: 0.15rem;
        }

        /* ── Skills ── */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.75rem 2rem;
        }

        .skill-row {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .skill-row strong {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 0.2rem;
        }

        /* ── Back link ── */
        .back-link {
            display: inline-block;
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #3a5343;
            opacity: 0.6;
            text-decoration: none;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* ── Responsive ── */
        @media (max-width: 560px) {
            .entry {
                grid-template-columns: 1fr;
            }
            .entry-date {
                grid-column: 1;
                grid-row: auto;
                text-align: left;
                margin-top: 0.2rem;
            }
            .resume-header h1 {
                font-size: 1.9rem;
            }
        }

        /* ── Print ── */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .back-link { display: none; }
        }
    </style>
</head>
<body>
    <div class="resume-wrap">
        {{ content }}
        <a href="{{ '/' | relative_url }}" class="back-link">← Home</a>
    </div>
</body>
</html>
