---
layout: default
---

<div class="profile-container">
    <img src="{{ site.data.profile.avatar | relative_url }}" alt="{{ site.data.profile.name }}" class="profile-photo">
</div>

<h1>{{ site.data.profile.name }}</h1>
<p>{{ site.data.profile.tagline }}</p>

<nav class="links" aria-label="Social and contact links">
  <div class="icon-links">
    {% for item in site.data.profile.links.icons %}
      <a href="{{ item.url }}" class="icon-link" aria-label="{{ item.label }}">
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
          <path d="{{ item.icon_path }}"/>
        </svg>
      </a>
    {% endfor %}
  </div>

  <div class="text-links" aria-label="Site links">
    {% for item in site.data.profile.links.menu %}
      <a href="{{ item.url | relative_url }}" class="text-link {{ item.class | default: '' }}">{{ item.label }}</a>
    {% endfor %}
  </div>
</nav>
